name: Validate repo rules

on:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run validate_repo_rules.py
        run: python3 scripts/validate_repo_rules.py --ignore "Dragon Quest XI S Demo"
